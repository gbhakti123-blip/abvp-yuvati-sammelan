<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | संवादिनी – युवती संमेलन</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar inner-navbar">

        <div class="logo-area">
            <img src="images/sammelan-logo.png" alt="संवादिनी – युवती संमेलन" class="sammelan-logo">
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="registration.html" class="active">Registration</a>
            <a href="programs.html">Programs</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <select class="language-selector">
                <option value="en">English</option>
                <option value="mr">मराठी</option>
                <option value="hi">हिन्दी</option>
            </select>
        </nav>

    </header>

    <main class="page registration-page">

        <img src="images/abvp-logo.png" alt="" class="abvp-background registration-abvp-background">

        <div class="page-content">

            <p class="page-label">संवादिनी – युवती संमेलन</p>
            <h1>Registration</h1>
            <p class="page-intro">
                Join us for a meaningful gathering of dialogue,
                ideas, inspiration and opportunities.
            </p>

            <div class="registration-card">

                <h2>Register for the Sammelan</h2>
                <p class="registration-description">
                    Please fill in the details below to register
                    for the upcoming Sammelan.
                </p>

                <form class="registration-form">

                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Number</label>
                        <input type="tel" id="whatsapp" name="whatsapp" placeholder="Enter your WhatsApp number" required>
                    </div>

                    <div class="form-group">
                        <label for="profession">Profession</label>
                        <input type="text" id="profession" name="profession" placeholder="Enter your profession" required>
                    </div>

                    <div class="form-group">
                        <label for="college">College</label>
                        <input type="text" id="college" name="college" placeholder="Enter your college name" required>
                    </div>

                    <div class="form-group">
                        <label for="education">Education</label>
                        <input type="text" id="education" name="education" placeholder="e.g. B.E. Computer Engineering" required>
                    </div>

                    <div class="form-group">
                        <label for="year">Year</label>
                        <input type="text" id="year" name="year" placeholder="e.g. 3rd Year" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>
                    </div>

                    <button type="submit" class="register-button">Submit Registration</button>

                </form>

            </div>

        </div>

    </main>

</body>
</html>
