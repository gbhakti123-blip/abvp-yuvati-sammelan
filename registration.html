<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Registration | संवादिनी – युवती संमेलन
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         NAVBAR
         SAME AS HOME PAGE
         ===================================================== -->

    <header class="navbar home-navbar">


        <div class="logo-area">


            <img
                src="images/abvp-logo.png"
                alt="ABVP"
                class="navbar-logo"
            >


            <div class="navbar-title">

                <span class="navbar-title-main">
                    संवादिनी
                </span>


                <span
                    class="navbar-title-sub"
                    data-i18n="navbar_title_sub"
                >
                    युवती संमेलन
                </span>

            </div>


        </div>


        <nav class="nav-links">


            <a
                href="index.html"
                data-i18n="nav_home"
            >
                Home
            </a>


            <a
                href="registration.html"
                class="active"
                data-i18n="nav_registration"
            >
                Registration
            </a>


            <a
                href="programs.html"
                data-i18n="nav_programs"
            >
                Programs
            </a>


            <a
                href="about.html"
                data-i18n="nav_about"
            >
                About Us
            </a>


            <a
                href="contact.html"
                data-i18n="nav_contact"
            >
                Contact Us
            </a>


            <select class="language-selector">

                <option value="en">
                    English
                </option>

                <option value="mr">
                    मराठी
                </option>

                <option value="hi">
                    हिन्दी
                </option>

            </select>


        </nav>


    </header>


    <!-- =====================================================
         REGISTRATION PAGE
         ===================================================== -->

    <main class="page registration-page">


        <!-- Background ABVP Logo -->

        <img
            src="images/abvp-logo.png"
            alt=""
            class="abvp-background registration-abvp-background"
        >


        <div class="page-content">


            <!-- Page heading -->

            <p
                class="page-label"
                data-i18n="page_label"
            >
                संवादिनी – युवती संमेलन
            </p>


            <h1
                data-i18n="registration_title"
            >
                Registration
            </h1>


            <p
                class="page-intro"
                data-i18n="page_intro"
            >
                Join us for a meaningful gathering of dialogue,
                ideas, inspiration and opportunities.
            </p>


            <!-- =================================================
                 REGISTRATION CARD
                 ================================================= -->

            <div class="registration-card">


                <h2
                    data-i18n="register_card_title"
                >
                    Register for the Sammelan
                </h2>


                <p
                    class="registration-description"
                    data-i18n="register_card_desc"
                >
                    Please fill in the details below to register
                    for the upcoming Sammelan.
                </p>


                <!-- =================================================
                     REGISTRATION FORM
                     ================================================= -->

                <form
                    class="registration-form"
                    id="registration-form"
                >


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label
                            for="full-name"
                            data-i18n="label_full_name"
                        >
                            Full Name
                        </label>


                        <input
                            type="text"
                            id="full-name"
                            name="full-name"
                            placeholder="Enter your full name"
                            data-i18n-placeholder="ph_full_name"
                            required
                        >

                    </div>


                    <!-- WHATSAPP -->

                    <div class="form-group">

                        <label
                            for="whatsapp"
                            data-i18n="label_whatsapp"
                        >
                            WhatsApp Number
                        </label>


                        <input
                            type="tel"
                            id="whatsapp"
                            name="whatsapp"
                            placeholder="Enter your WhatsApp number"
                            data-i18n-placeholder="ph_whatsapp"
                            required
                        >

                    </div>


                    <!-- PROFESSION -->

                    <div class="form-group">

                        <label
                            for="profession"
                            data-i18n="label_profession"
                        >
                            Profession
                        </label>


                        <input
                            type="text"
                            id="profession"
                            name="profession"
                            placeholder="Enter your profession"
                            data-i18n-placeholder="ph_profession"
                            required
                        >

                    </div>


                    <!-- COLLEGE -->

                    <div class="form-group">

                        <label
                            for="college"
                            data-i18n="label_college"
                        >
                            College
                        </label>


                        <input
                            type="text"
                            id="college"
                            name="college"
                            placeholder="Enter your college name"
                            data-i18n-placeholder="ph_college"
                            required
                        >

                    </div>


                    <!-- EDUCATION -->

                    <div class="form-group">

                        <label
                            for="education"
                            data-i18n="label_education"
                        >
                            Education
                        </label>


                        <input
                            type="text"
                            id="education"
                            name="education"
                            placeholder="e.g. B.E. Computer Engineering"
                            data-i18n-placeholder="ph_education"
                            required
                        >

                    </div>


                    <!-- YEAR -->

                    <div class="form-group">

                        <label
                            for="year"
                            data-i18n="label_year"
                        >
                            Year
                        </label>


                        <input
                            type="text"
                            id="year"
                            name="year"
                            placeholder="e.g. 3rd Year"
                            data-i18n-placeholder="ph_year"
                            required
                        >

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group">

                        <label
                            for="address"
                            data-i18n="label_address"
                        >
                            Address
                        </label>


                        <textarea
                            id="address"
                            name="address"
                            rows="4"
                            placeholder="Enter your address"
                            data-i18n-placeholder="ph_address"
                            required
                        ></textarea>

                    </div>


                    <!-- SUBMIT BUTTON -->

                    <button
                        type="submit"
                        class="register-button"
                        data-i18n="submit_btn"
                    >
                        Submit Registration
                    </button>


                    <!-- REGISTRATION STATUS -->

                    <p
                        id="registration-status"
                        style="
                            margin-top:16px;
                            font-weight:600;
                        "
                    ></p>


                </form>


            </div>


        </div>


    </main>


    <!-- EXISTING JAVASCRIPT -->

    <script src="js/script.js"></script>


</body>

</html>
